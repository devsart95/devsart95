<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="S4R — redes ISP, datacenter, backend y automatización">
  <title>S4R — devsart95</title>
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#22d3ee"/>
      <stop offset="55%"  stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ff2fd0"/>
    </linearGradient>
    <linearGradient id="neonSoft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#22d3ee" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#ff2fd0" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#22d3ee" stop-opacity=".9"/>
      <stop offset="70%"  stop-color="#ff2fd0" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#ff2fd0" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#22d3ee" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" fill-opacity=".025"/>
    </pattern>

    <style>
      .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .glitch-c, .glitch-m { mix-blend-mode: screen; }
      .glitch-c { animation: gc 5.5s steps(1) infinite; }
      .glitch-m { animation: gm 5.5s steps(1) infinite; }
      @keyframes gc {
        0%, 86%, 100% { transform: translate(0,0);   opacity: 0; }
        87%           { transform: translate(-5px,2px); opacity: .95; }
        89%           { transform: translate(4px,-2px); opacity: .95; }
        91%           { transform: translate(-2px,0);   opacity: .6; }
        93%           { transform: translate(0,0);      opacity: 0; }
      }
      @keyframes gm {
        0%, 86%, 100% { transform: translate(0,0);   opacity: 0; }
        88%           { transform: translate(5px,-2px); opacity: .95; }
        90%           { transform: translate(-4px,2px); opacity: .95; }
        92%           { transform: translate(2px,0);    opacity: .6; }
        94%           { transform: translate(0,0);      opacity: 0; }
      }
      .flick { animation: fk 5.5s steps(1) infinite; }
      @keyframes fk {
        0%, 86%, 100% { opacity: 1; }
        88%           { opacity: .55; }
        90%           { opacity: 1; }
        92%           { opacity: .7; }
      }
      .caret { animation: bl 1.1s steps(1) infinite; }
      @keyframes bl { 0%,50% { opacity: 1 } 51%,100% { opacity: 0 } }
      .dash { stroke-dasharray: 14 10; animation: mv 2.2s linear infinite; }
      @keyframes mv { to { stroke-dashoffset: -48; } }
      .pulse { animation: pl 2.6s ease-in-out infinite; }
      @keyframes pl { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
      @media (prefers-reduced-motion: reduce) {
        .glitch-c, .glitch-m, .flick, .caret, .dash, .pulse { animation: none; }
        .glitch-c, .glitch-m { opacity: 0; }
      }
    </style>
  </defs>

  <rect width="1200" height="400" fill="#04060b"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- circuitos: trazas de red -->
  <g fill="none" stroke="url(#neonSoft)" stroke-width="1.5" opacity=".5">
    <path class="dash" d="M0 60 H180 L210 90 H330"/>
    <path class="dash" d="M1200 330 H1010 L980 300 H860"/>
    <path d="M60 400 V360 L90 330 H150"/>
    <path d="M1140 0 V44 L1110 74 H1040"/>
    <path class="dash" d="M1200 140 H1080 L1050 170 H940"/>
  </g>
  <g fill="#22d3ee" opacity=".8">
    <circle class="pulse" cx="330" cy="90" r="3.5"/><circle cx="150" cy="330" r="3"/>
  </g>
  <g fill="#ff2fd0" opacity=".8">
    <circle class="pulse" cx="860" cy="300" r="3.5"/><circle cx="1040" cy="74" r="3"/><circle cx="940" cy="170" r="3"/>
  </g>

  <!-- esquinas HUD -->
  <g stroke="url(#neon)" stroke-width="2" fill="none" opacity=".9">
    <path d="M28 74 V40 H62"/>
    <path d="M1172 74 V40 H1138"/>
    <path d="M28 326 V360 H62"/>
    <path d="M1172 326 V360 H1138"/>
  </g>

  <!-- tag superior -->
  <text class="mono" x="80" y="76" font-size="15" letter-spacing="5" fill="#22d3ee" opacity=".85">
    ▓▒░ github.com/devsart95
  </text>
  <text class="mono" x="1120" y="76" font-size="15" letter-spacing="3" fill="#ff2fd0" opacity=".85" text-anchor="end">
    ░▒▓
  </text>

  <!-- titulo con glitch -->
  <g class="flick">
    <text class="mono glitch-c" x="80" y="186" font-size="104" font-weight="700" letter-spacing="10" fill="#22d3ee">S4R</text>
    <text class="mono glitch-m" x="80" y="186" font-size="104" font-weight="700" letter-spacing="10" fill="#ff2fd0">S4R</text>
    <text class="mono"          x="80" y="186" font-size="104" font-weight="700" letter-spacing="10" fill="#f5f7ff" filter="url(#glowSoft)">S4R</text>
  </g>
  <rect class="caret" x="330" y="144" width="22" height="52" fill="#22d3ee" opacity=".9"/>

  <!-- linea divisoria -->
  <rect x="80" y="216" width="1040" height="2" fill="url(#fade)" filter="url(#glow)"/>

  <!-- claim -->
  <text class="mono" x="80" y="254" font-size="21" letter-spacing="2.5" fill="#cbd5e1">
    REDES ISP <tspan fill="#ff2fd0">/</tspan> DATACENTER <tspan fill="#ff2fd0">/</tspan> BACKEND <tspan fill="#ff2fd0">/</tspan> AUTOMATIZACIÓN
  </text>

  <!-- stack: dos filas, codigo e infra -->
  <g class="mono" font-size="13" letter-spacing="1.5">
    <text x="80" y="303" font-size="11" letter-spacing="2.5" fill="#22d3ee" opacity=".75">CÓDIGO ▸</text>
    <g transform="translate(160,286)">
      <rect width="86"  height="26" rx="4" fill="#0b1220" stroke="#22d3ee" stroke-opacity=".55"/>
      <text x="43" y="18" fill="#7dd3fc" text-anchor="middle">python</text>
    </g>
    <g transform="translate(256,286)">
      <rect width="118" height="26" rx="4" fill="#0b1220" stroke="#22d3ee" stroke-opacity=".5"/>
      <text x="59" y="18" fill="#7dd3fc" text-anchor="middle">typescript</text>
    </g>
    <g transform="translate(384,286)">
      <rect width="70"  height="26" rx="4" fill="#0b1220" stroke="#22d3ee" stroke-opacity=".45"/>
      <text x="35" y="18" fill="#7dd3fc" text-anchor="middle">odoo</text>
    </g>
    <g transform="translate(464,286)">
      <rect width="118" height="26" rx="4" fill="#0b1220" stroke="#22d3ee" stroke-opacity=".45"/>
      <text x="59" y="18" fill="#7dd3fc" text-anchor="middle">postgresql</text>
    </g>

    <text x="80" y="341" font-size="11" letter-spacing="2.5" fill="#ff2fd0" opacity=".75">INFRA  ▸</text>
    <g transform="translate(160,324)">
      <rect width="86"  height="26" rx="4" fill="#0b1220" stroke="#8b5cf6" stroke-opacity=".55"/>
      <text x="43" y="18" fill="#c4b5fd" text-anchor="middle">docker</text>
    </g>
    <g transform="translate(256,324)">
      <rect width="94"  height="26" rx="4" fill="#0b1220" stroke="#8b5cf6" stroke-opacity=".5"/>
      <text x="47" y="18" fill="#c4b5fd" text-anchor="middle">proxmox</text>
    </g>
    <g transform="translate(360,324)">
      <rect width="102" height="26" rx="4" fill="#0b1220" stroke="#ff2fd0" stroke-opacity=".5"/>
      <text x="51" y="18" fill="#f9a8e8" text-anchor="middle">mikrotik</text>
    </g>
    <g transform="translate(472,324)">
      <rect width="118" height="26" rx="4" fill="#0b1220" stroke="#ff2fd0" stroke-opacity=".45"/>
      <text x="59" y="18" fill="#f9a8e8" text-anchor="middle">cloudflare</text>
    </g>
    <g transform="translate(600,324)">
      <rect width="76"  height="26" rx="4" fill="#0b1220" stroke="#ff2fd0" stroke-opacity=".45"/>
      <text x="38" y="18" fill="#f9a8e8" text-anchor="middle">linux</text>
    </g>
  </g>

  <rect width="1200" height="400" fill="url(#scan)" pointer-events="none"/>
</svg>
